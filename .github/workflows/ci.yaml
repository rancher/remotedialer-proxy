name: Run Unit Tests

on:
    pull_request:
        paths-ignore:
        - '.gitignore'
        - 'CODEOWNERS'
        - 'LICENSE'


jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.26:1.26.11
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run tests
        run: go test -v -cover ./...
