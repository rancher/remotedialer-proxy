name: Run Unit Tests

on:
    pull_request:
        paths-ignore:
        - '.gitignore'
        - 'CODEOWNERS'
        - 'LICENSE'


jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.26:1.26.11
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run tests
        run: go test -v -cover ./...
