name: Run Unit Tests

on:
    pull_request:
        paths-ignore:
        - '.gitignore'
        - 'CODEOWNERS'
        - 'LICENSE'


jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.27:1.27.4
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run tests
        run: go test -v -cover ./...
